# Render Deployment Blueprint for Crazy Vlzzz Portfolio
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Option 1: Static Site (Recommended for Vite/React - Free & fast on Render CDN)
  - type: web
    name: crazy-vlzzz-portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
